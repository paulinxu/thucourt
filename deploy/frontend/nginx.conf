server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 105m;
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /admin/ { proxy_pass http://backend:8000/admin/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /static/ { proxy_pass http://backend:8000/static/; }
  location / { try_files $uri /index.html; }
}
